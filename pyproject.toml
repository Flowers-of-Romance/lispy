[project]
name = "ds4ds4"
version = "0"  # PEP 621 requires this; carries no semantic claim
description = "agent layer — soul is absent, ds4ds4 only"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    "textual>=8.2.6",
]

[project.scripts]
ds4ds4 = "ds4ds4:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ds4ds4.py"]

[tool.hatch.build.targets.wheel.sources]
"ds4ds4.py" = "ds4ds4.py"
