[project]
name = "bodies"
version = "0"  # PEP 621 requires this; carries no semantic claim
description = "agent layer — soul is absent, bodies only"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
]

[project.scripts]
bodies = "bodies:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bodies.py"]

[tool.hatch.build.targets.wheel.sources]
"bodies.py" = "bodies.py"
