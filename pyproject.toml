[project]
name = "lispy"
version = "0"  # PEP 621 requires this; carries no semantic claim
description = "live-redefinable agent evaluator (lispy core + host support)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
]

[project.scripts]
lispy = "lispy:main"
host = "host:main"
lispy-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["host.py", "lispy.py", "edit.py", "server.py"]

[tool.hatch.build.targets.wheel.sources]
"host.py" = "host.py"
"lispy.py" = "lispy.py"
"edit.py" = "edit.py"
"server.py" = "server.py"
